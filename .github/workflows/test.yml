name: Test

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript type check
      run: npx tsc --noEmit

  build-all-versions:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run full build
      run: npm run build && npm run build:browser
  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build && npm run build:browser

    # test:coverage is test:unit plus a coverage floor. The floor is a ratchet:
    # it is set to the coverage the suite actually achieves, so a PR that adds
    # code without tests fails here rather than quietly diluting the number.
    # Raise it when coverage rises; never lower it to make a build pass.
    - name: Run unit tests with coverage floor
      run: npm run test:coverage

  integration-test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install benchmark fixture dependencies
      run: npm run benchmark:install

    - name: Build project
      run: npm run build && npm run build:browser

    # No setup-chrome step: it put its own ChromeDriver on PATH while Selenium
    # launched the runner's preinstalled google-chrome, and the two drifted
    # apart ("This version of ChromeDriver only supports Chrome version N").
    # Selenium Manager resolves a driver matching the installed Chrome, which
    # is also the path users take.
    - name: Show Chrome version
      run: google-chrome --version

    # REQUIRE_BROWSER=1 makes a browser that will not start a hard failure.
    # Without it a broken driver silently skips the crawl suite and the job
    # still reports green, which is how the previous suite hid breakage.
    - name: Run integration tests
      run: npm run test:integration
      env:
        REQUIRE_BROWSER: '1'
